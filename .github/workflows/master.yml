name: Industrial CI Humble

on:
  push:
    branches: [ docs_update ]
  pull_request:
    branches: [ docs_update ]
  workflow_dispatch:

jobs:
  industrial_ci:
    name: ROS ${{ matrix.ROS_DISTRO }} (${{ matrix.ROS_REPO }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [humble]
        ROS_REPO: [testing]
    env:
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.ROS_DISTRO }}-${{ matrix.ROS_REPO }}-${{github.run_id}}
          restore-keys: |
            ccache-${{ matrix.ROS_DISTRO }}-${{ matrix.ROS_REPO }}-

      # Step 3: This modifies the VM environment
      - name: Install System Dependencies
        run: |
          sudo add-apt-repository ppa:lely/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            liblely-coapp-dev liblely-co-tools \
            liblely-can-dev liblely-co-dev liblely-ev-dev \
            liblely-io2-dev liblely-libc-dev liblely-tap-dev \
            liblely-util-dev python3-dcf-tools pkg-config can-utils

      # Step 4: Use the VM environment directly
      - uses: 'ros-industrial/industrial_ci@master'
        env:
          BEFORE_INSTALL_TARGET_DEPENDENCIES: 'sudo apt-get update'
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          ROS_REPO: ${{ matrix.ROS_REPO }}
          DOCKER_BASE_IMAGE: "" # Forces CI to run on the runner, not in a fresh Docker container
